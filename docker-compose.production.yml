# ==============================================================================
# docker-compose.production.yml — SiWali Production
# Opsi: Deploy Docker bersama services lain di host yang sama
# ==============================================================================
# Topology server (4 Core / 4GB):
#   Docker network "polije-net" (external, shared dengan services lain):
#     - mysql, redis, rabbitmq, adminer, node-exporter (sudah jalan)
#     - go-api, vue-fe, notification, signature-svc (sudah jalan)
#   Docker network "siwali-internal" (internal, hanya siwali):
#     - siwali-app, siwali-worker, siwali-scheduler
#
# Siwali terhubung ke:
#   - mysql/redis/rabbitmq via "polije-net" network (container name)
#   - JTIForm di k3s: via HOST_IP (jika perlu interservice call)
# ==============================================================================
#
# Cara deploy:
#   # Pertama kali:
#   docker compose -f docker-compose.production.yml up -d
#
#   # Update image (rolling restart):
#   docker compose -f docker-compose.production.yml pull app worker scheduler
#   docker compose -f docker-compose.production.yml up -d --no-deps app worker scheduler
#
#   # Lihat log:
#   docker compose -f docker-compose.production.yml logs -f --tail=100 app
# ==============================================================================

services:

  # ── App Server (FrankenPHP + Octane) ─────────────────────────────────────────
  app:
    image: ghcr.io/YOUR_ORG/siwali:latest   # ← Ganti YOUR_ORG
    container_name: siwali-app
    restart: unless-stopped

    environment:
      # ── FrankenPHP / Caddyfile ─────────────────────────────────────────────
      CADDY_SERVER_SERVER_NAME: "http://:8000"
      APP_PUBLIC_PATH: /app/public

      # ── Worker Count — DISESUAIKAN untuk shared 4GB server ─────────────────
      # Kalkulasi:
      #   Sisa RAM untuk SiWali ≈ 600-700MB (setelah MySQL, Redis, dll.)
      #   memory_limit = 96M per worker
      #   App overhead = ~200MB
      #   Tersedia untuk worker = 500MB / 96MB = ~5 workers
      #   Tapi JTIForm juga jalan → konservatif: 4 workers
      CADDY_SERVER_WORKER_COUNT: "4"

    # Load env sensitif dari file — JANGAN commit .env.production ke git!
    env_file:
      - .env.production

    ports:
      # Hanya expose ke loopback jika ada Nginx di depannya
      # Atau expose ke semua interface jika langsung kena internet:
      - "127.0.0.1:8003:8000"  # Ganti 8003 dengan port yang belum dipakai

    volumes:
      - siwali-logs:/app/storage/logs
      - caddy-data:/data
      - caddy-config:/config
      - opcache-tmpfs:/tmp/php-opcache

    networks:
      - siwali-internal
      - polije-net      # Shared network — akses ke mysql, redis, rabbitmq

    # ── Resource Limits — KRITIS di shared server ──────────────────────────
    # Tanpa ini, satu container bisa memakan semua RAM dan bikin OOM
    deploy:
      resources:
        reservations:
          cpus: '0.2'
          memory: 256M    # Jaminan minimum
        limits:
          cpus: '0.8'     # Max 0.8 core (sisakan untuk JTIForm & services lain)
          memory: 704M    # 4×96MB worker + 256MB overhead + buffer

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Queue Worker ──────────────────────────────────────────────────────────────
  worker:
    image: ghcr.io/YOUR_ORG/siwali:latest
    container_name: siwali-worker
    restart: unless-stopped

    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "redis"
      - "--sleep=3"
      - "--tries=3"
      - "--max-time=3600"   # Restart worker tiap 1 jam (mitigasi memory leak)
      - "--memory=96"       # Sesuai memory_limit PHP
      - "--timeout=120"     # Per-job timeout (PDF+ESign bisa 60-90s)

    env_file:
      - .env.production

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: error

    volumes:
      - siwali-logs:/app/storage/logs

    networks:
      - siwali-internal
      - polije-net

    deploy:
      resources:
        reservations:
          memory: 96M
        limits:
          cpus: '0.4'
          memory: 200M

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Scheduler ─────────────────────────────────────────────────────────────────
  scheduler:
    image: ghcr.io/YOUR_ORG/siwali:latest
    container_name: siwali-scheduler
    restart: unless-stopped

    command: ["php", "artisan", "schedule:work"]

    env_file:
      - .env.production

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

    volumes:
      - siwali-logs:/app/storage/logs

    networks:
      - siwali-internal
      - polije-net

    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  siwali-logs:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  # tmpfs untuk OPcache file cache — faster restart warm-up
  opcache-tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,uid=82,gid=82"  # uid/gid untuk www-data di alpine

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  siwali-internal:
    # Internal network hanya untuk komunikasi antar container siwali
    internal: true
    driver: bridge

  polije-net:
    # External network yang sudah dibuat oleh services lain (mysql, redis, dll.)
    # Buat network ini dengan:
    #   docker network create polije-net
    # Atau gunakan nama network yang sudah ada di compose services lain
    external: true
    name: polije-net   # Sesuaikan dengan nama network yang dipakai mysql/redis
