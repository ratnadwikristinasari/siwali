name: Build and Deploy to Production

on:
  push:
    branches: ["production"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, gd, zip, bcmath, sockets
          coverage: none

      - name: Prepare environment file
        run: |
          cp .env.example .env
          sed -i 's/APP_ENV=production/APP_ENV=testing/g' .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Execute Tests
        run: php artisan test

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=sha,format=short

      - name: Build and push clean Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            ASSET_URL=${{ vars.ASSET_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=${REGISTRY}/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Remove untagged images from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # Scope API orgs/... atau users/...
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            SCOPE="orgs/${OWNER}"
          else
            SCOPE="users/${OWNER}"
          fi

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          echo "Listing untagged versions for ghcr.io/${OWNER}/${PACKAGE} ..."
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/${SCOPE}/packages/container/${PACKAGE}/versions?per_page=100" \
          | jq -r '.[] | select(.metadata.container.tags | length == 0) | .id' \
          | while read -r VID; do
              echo "Deleting version id: ${VID}"
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/${SCOPE}/packages/container/${PACKAGE}/versions/${VID}"
            done

          echo "Done removing untagged images."

  deploy:
    name: Deploy to VM
    runs-on: self-hosted
    needs: build
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          DEPLOY_REF: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH,GHCR_USER,GHCR_TOKEN,APP_IMAGE,DEPLOY_REF
          script_stop: true
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            git fetch --depth=1 origin "$DEPLOY_REF"
            git checkout --force --detach FETCH_HEAD

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            export APP_IMAGE
            COMPOSE="docker compose -f docker/compose.yaml"
            $COMPOSE pull app worker
            $COMPOSE up -d --no-build --remove-orphans app worker

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8084/up >/dev/null; then ok=1; break; fi
              sleep 2
            done
            [ "${ok:-0}" = "1" ] || { $COMPOSE logs --tail=50 app; exit 1; }

            $COMPOSE exec -T app php artisan migrate --force
            docker image prune -f
