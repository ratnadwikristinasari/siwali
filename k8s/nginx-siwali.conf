# ==============================================================================
# siwali.conf — Nginx config untuk SiWali
# Letakkan di /etc/nginx/project-jti.d/siwali.conf di VM Nginx publik
# ==============================================================================
# Infrastruktur:
#   VM Nginx (public IP) → proxy ke VM k3s (10.10.0.55:32725)
#   Pola sama dengan JTIForm: /jtiform/ → 10.10.0.31:32724
#                             /siwali/  → 10.10.0.55:32725  ← SiWali
#
# NodePort SiWali: 32725 (JTIForm = 32724, tambah 1)
# IP VM k3s SiWali: 10.10.0.55 (sesuaikan dengan IP VM k3s-mu)
# ==============================================================================

# ── Static assets: strip prefix /siwali → teruskan path asli ke container ────
# Vite build menghasilkan /build/assets/xxx.js
# Nginx: /siwali/build/assets/xxx.js → backend: /build/assets/xxx.js
location /siwali/build/ {
    proxy_pass http://10.10.0.55:32725/build/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Cache agresif di browser untuk Vite-hashed assets
    # (filename sudah mengandung hash, aman cache 1 tahun)
    add_header Cache-Control "public, immutable, max-age=31536000";
}

# ── Upload/storage files ──────────────────────────────────────────────────────
# Jika ada file yang di-serve dari /storage (misalnya KHS yang di-symlink)
# Biasanya SiWali pakai S3, tapi jaga-jaga tetap di-proxy
location /siwali/storage/ {
    proxy_pass http://10.10.0.55:32725/storage/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Semua request lain ke /siwali/ → teruskan KE BACKEND DENGAN PREFIX ────────
# PENTING: proxy_pass tanpa path setelah port = URI penuh diteruskan
# Artinya: /siwali/login → backend menerima /siwali/login
# Laravel kemudian menangani /siwali/ sebagai base path via APP_URL
location /siwali/ {
    proxy_pass http://10.10.0.55:32725;
    proxy_http_version 1.1;

    # Headers wajib untuk Laravel TrustProxies
    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header X-Forwarded-Host    $host;
    proxy_set_header X-Forwarded-Port    $server_port;
    # Header ini memberi tahu Laravel bahwa base prefix-nya adalah /siwali
    # Digunakan oleh TrustProxies untuk generate URL yang benar
    proxy_set_header X-Forwarded-Prefix  /siwali;

    # Nonaktifkan redirect rewriting (Laravel handle sendiri)
    proxy_redirect off;

    # Timeout lebih panjang untuk request PDF/ESign yang bisa lama
    proxy_connect_timeout   10s;
    proxy_send_timeout      120s;
    proxy_read_timeout      120s;

    # WebSocket support (untuk Livewire polling jika ada)
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Buffer settings untuk response besar (PDF download)
    proxy_buffering         on;
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;
}
