name: siwali
x-app: &app
  image: ${APP_IMAGE:-siwali:latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      ASSET_URL: ${ASSET_URL:-}
  restart: unless-stopped
  env_file: ./.env.app
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs:
    - /tmp
    - /app/bootstrap/cache:uid=10001,gid=10001,mode=0755
  volumes:
    - app_storage_siwali:/app/storage
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  app:
    <<: *app
    container_name: siwali
    ports:
      - "127.0.0.1:8084:8080"
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits:
          memory: 768m

  worker:
    <<: *app
    container_name: siwali-worker
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 384m

volumes:
  app_storage_siwali:
