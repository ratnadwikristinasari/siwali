; ==============================================================================
; PHP Production INI Override untuk SiWali + FrankenPHP + Octane
; File ini di-copy ke $PHP_INI_DIR/conf.d/99-production.ini
; Untuk k3s: mount lewat ConfigMap ke /usr/local/etc/php/conf.d/99-production.ini
; ==============================================================================

[PHP]
; Sembunyikan versi PHP dari header response (security)
expose_php = Off

; Memory limit per worker thread
; Rumus aman: num_threads x memory_limit < available RAM
; Server shared 4GB: 4 worker x 96M = 384MB — aman bersama services lain
; Jika server dedicated ≥ 4GB untuk SiWali saja, naikkan ke 128M
memory_limit = 128M

; Batas eksekusi per request (Octane juga punya config ini di octane.php)
max_execution_time = 60

; Upload limits (sesuai kebutuhan KHS upload max 1MB)
upload_max_filesize = 5M
post_max_size = 8M

; Realpath cache — kritis untuk performa di Octane karena filesystem calls mahal
; Worker persistent, cache ini jarang invalid
realpath_cache_size = 32M
realpath_cache_ttl = 600

; Timezone
date.timezone = Asia/Jakarta

[Opcache]
; Aktifkan OPcache — WAJIB untuk performa Octane
opcache.enable = 1
opcache.enable_cli = 1

; Memory untuk menyimpan opcode (meningkatkan hit rate)
; Turunkan ke 128 untuk shared server — 256 terlalu besar jika banyak service jalan
opcache.memory_consumption = 128

; Untuk Octane: MATIKAN validate_timestamps
; Worker persistent — file tidak berubah setelah deploy
; Mengaktifkan ini di production = overhead disk read per request
opcache.validate_timestamps = 0

; Jumlah file maksimal yang di-cache
; Jumlah ini sesuai untuk aplikasi Laravel medium-large
opcache.max_accelerated_files = 32531

; Simpan file cache ke disk sebagai backup (useful saat restart worker)
opcache.file_cache = /tmp/php-opcache

; String interning untuk string yang sering dipakai
opcache.interned_strings_buffer = 32

; Fast shutdown — lebih cepat saat worker restart
opcache.fast_shutdown = 1

; Preloading (opsional tapi direkomendasikan untuk Octane)
; Uncomment dan sesuaikan path jika ingin aktifkan preloading
; opcache.preload = /app/vendor/autoload.php
; opcache.preload_user = www-data

[JIT]
; JIT Tracing — mode terbaik untuk web workload dengan banyak loop
; tracing = 1254 (default untuk JIT tracing mode)
opcache.jit = tracing
; Turunkan ke 32M untuk shared server (hemat ~32MB per container)
opcache.jit_buffer_size = 32M

; Tuning JIT — lebih agresif untuk workload yang repetitif
opcache.jit_hot_loop = 64
opcache.jit_hot_func = 128
opcache.jit_hot_return = 8
opcache.jit_hot_side_exit = 8
